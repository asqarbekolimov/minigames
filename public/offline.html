<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#242145" />
    <title>MiniGames — Offline</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        color-scheme: light;
        font-family:
          'Segoe UI',
          system-ui,
          -apple-system,
          sans-serif;
        background: #f9f8f3;
        color: #242145;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(440px, 100%);
        padding: 40px 32px;
        border: 2px solid #242145;
        border-radius: 24px;
        background: #fffcf5;
        box-shadow: 8px 8px 0 #242145;
        text-align: center;
      }

      .badge {
        display: grid;
        width: 72px;
        height: 72px;
        margin: 0 auto 24px;
        place-items: center;
        border-radius: 50%;
        background: #ffd02b;
        color: #242145;
        font-size: 34px;
        font-weight: 800;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 28px;
      }

      p {
        margin: 0 0 24px;
        color: #5f5d75;
        line-height: 1.6;
      }

      a {
        display: inline-block;
        padding: 14px 28px;
        border: 2px solid #242145;
        border-radius: 999px;
        background: #ffd02b;
        color: #242145;
        font-weight: 700;
        text-decoration: none;
        transition: transform 150ms ease;
      }

      a:hover,
      a:focus-visible {
        transform: translateY(-2px);
      }

      button {
        display: block;
        margin: 16px auto 0;
        border: 0;
        background: none;
        color: #5f5d75;
        font: inherit;
        text-decoration: underline;
        cursor: pointer;
      }

      [hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="badge" aria-hidden="true">M</div>
      <h1>You are offline</h1>
      <p>MiniGames could not load this page right now. Cached pages are still available.</p>
      <a href="/">Open Home</a>
      <button type="button" id="retry" hidden>Try again</button>
    </main>
    <script>
      const retry = document.getElementById('retry');
      const showRetry = () => {
        retry.hidden = navigator.onLine;
      };

      retry.addEventListener('click', () => globalThis.location.reload());
      globalThis.addEventListener('online', () => globalThis.location.reload());
      showRetry();
    </script>
  </body>
</html>
